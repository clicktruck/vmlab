# Can Docker Desktop run a Linux container on a rented Windows 11 machine? One machine, a few steps, about half an hour.
# The installer's hash is not pinned here on purpose: the first run prints the hash it saw and installs nothing.
# Check that hash against Docker's published value, then put it in InstallerSha256 below.
name: windows-docker-desktop
description: Install Docker Desktop on Windows 11 and run hello-world.
profiles: [windows-11]
sources: []
suites:
  - name: windows-docker-desktop
    inputs:
      InstallerSha256: ""
